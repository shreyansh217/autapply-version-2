name: Naukri Show Interest

on:
  schedule:
    # GitHub uses UTC. IST is UTC +5:30.

    # 10:00 AM IST -> 04:30 UTC
    - cron: '30 4 * * *'

  workflow_dispatch:

jobs:
  run-naukri-bot:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: Naukri-autoapply-bot

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache pip packages
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Naukri-autoapply-bot/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 5. Install Chrome + ChromeDriver
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      # Export Chrome paths
      - name: Export Chrome paths
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_BIN=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      # 6. Run Recommended Jobs interest script
      - name: Share interest in Recommended Jobs
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
          NAUKRI_HEADLESS: 'true'
          NAUKRI_MAX_INTEREST: '50'
        run: python Naukri-Show-Interest.py

      # 7. Upload or update the resume
      - name: Upload Resume
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
        run: python Naukri-ResumeUpload.py
        continue-on-error: true