name: Naukri Show Interest

on:
  schedule:
    # GitHub uses UTC time. IST is UTC +5:30.
    # 10:00 AM IST -> 04:30 UTC
    - cron: '30 4 * * *'

  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  run-naukri-bot:
    runs-on: ubuntu-latest

    defaults:
      run:
        # All "run:" steps will execute inside this subfolder
        working-directory: Naukri-autoapply-bot

    steps:
      # ── 1. Checkout the repository (includes resume.pdf) ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Cache pip packages ──────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Naukri-autoapply-bot/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── 4. Install dependencies ────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Install Chrome ──────────────────────────────────────────────
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      # ── 6. Run Recommended Jobs interest script ───────────────────────
      - name: Share interest in Recommended Jobs
        env:
          NAUKRI_EMAIL:    ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_COOKIES:  ${{ secrets.NAUKRI_COOKIES }}
          NAUKRI_HEADLESS: 'true'
          NAUKRI_MAX_INTEREST: '50'
        run: python Naukri-Show-Interest.py
